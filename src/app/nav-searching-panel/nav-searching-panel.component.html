<section [class.showSection]="tools.isSectionShown()">
  <div class="searchCard">
    <h4>Searched Products</h4>
    @if (tools.loader()) {
      <app-spinner></app-spinner>
    } @else {
      @for (item of searchedList(); track $index) {
        <div
          class="card"
          routerLink="/details/{{ item._id }}"
          (click)="tools.isSectionShown.set(false)"
        >
          <i class="fa-solid fa-angle-right"></i>
          <img
            [src]="item.thumbnail"
            (error)="item.thumbnail = '/nophoto.jpg'"
            alt="product"
          />
          <div class="desc">
            <h5>{{ item.title }}</h5>
            <h3>
              {{ item.price.current | currency }}
              @if (item.price.current < item.price.beforeDiscount) {
                <span>{{ item.price.beforeDiscount | currency }}</span>
              }
            </h3>
          </div>
        </div>
      }
      @empty {
        <h4 style="color: darkred;">Products not found</h4>
      }
    }
  </div>
</section>
